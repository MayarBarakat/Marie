<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Marie will you be my Valentine?</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg1: #ffd6e7;
      --bg2: #ffeef6;
      --card: #ffffffcc;
      --yes: #ff3b7a;
      --yesHover: #ff1f68;
      --love: #ff1f68;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, var(--bg2), var(--bg1));
      font-family: system-ui, sans-serif;
      overflow: hidden;
      padding: 16px;
    }

    #confettiCanvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
    }

    .card {
      width: min(720px, 92vw);
      padding: 26px 22px;
      background: var(--card);
      backdrop-filter: blur(10px);
      border-radius: 22px;
      text-align: center;
      box-shadow: 0 18px 60px rgba(0,0,0,.15);
    }

    h1 {
      font-size: clamp(26px, 4vw, 44px);
      margin: 12px 0 18px;
      min-height: 3em;
    }

    .love {
      color: var(--love);
      animation: heartbeat 1s infinite;
    }

    @keyframes heartbeat {
      0% { transform: scale(1); }
      25% { transform: scale(1.08); }
      50% { transform: scale(1); }
      75% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .cursor::after {
      content: "|";
      animation: blink 1s infinite;
      margin-left: 2px;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .button-zone {
      position: relative;
      width: min(520px, 92%);
      height: 150px;
      margin: 0 auto;
      touch-action: none;
    }

    button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      padding: 16px 24px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
    }

    #yesBtn {
      left: 18%;
      background: var(--yes);
      color: #fff;
    }

    #noBtn {
      left: 62%;
      background: #e5e7eb;
    }

    .hint {
      margin-top: 10px;
      font-size: 13px;
      opacity: .7;
    }

    .result {
      display: none;
      margin-top: 18px;
    }

    img {
      width: min(380px, 90vw);
      display: block;
      margin: auto;
    }
  </style>
</head>

<body>
<canvas id="confettiCanvas"></canvas>

<main class="card">
  <h1 id="title">Marie will you be my Valentine?</h1>

  <section class="button-zone" id="zone">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
  </section>

  <div class="hint" id="hint">“No” seems a bit shy 😈</div>

  <section class="result" id="result">
    <h2>💖💖💖</h2>
    <img src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif" />
  </section>
</main>

<audio id="yesSound" src="https://assets.mixkit.co/sfx/preview/mixkit-magic-sweep-game-trophy-257.wav"></audio>

<script>
  const title = document.getElementById("title");
  const yesBtn = document.getElementById("yesBtn");
  const noBtn = document.getElementById("noBtn");
  const zone = document.getElementById("zone");
  const hint = document.getElementById("hint");
  const result = document.getElementById("result");
  const yesSound = document.getElementById("yesSound");

  /* Confetti */
  const canvas = document.getElementById("confettiCanvas");
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const confettiInstance = confetti.create(canvas, { resize: true });

  function party() {
    confettiInstance({
      particleCount: 300,
      spread: 160,
      startVelocity: 60,
      origin: { x: 0.5, y: 0.5 }
    });
  }

  /* No button runs */
  noBtn.addEventListener("mouseenter", () => {
    noBtn.style.left = Math.random() * 70 + "%";
    noBtn.style.top = Math.random() * 70 + "%";
  });

  /* Typewriter */
  function typeLines(el, lines, speed = 55) {
    el.textContent = "";
    el.classList.add("cursor");
    let l = 0, i = 0;

    function nextChar() {
      if (l >= lines.length) {
        el.classList.remove("cursor");
        el.classList.add("love");
        return;
      }
      if (i < lines[l].length) {
        el.innerHTML += lines[l][i++];
      } else {
        el.innerHTML += "<br>";
        l++; i = 0;
      }
      setTimeout(nextChar, speed);
    }
    nextChar();
  }

  yesBtn.addEventListener("click", () => {
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    yesSound.play();

    typeLines(title, [
      "YAY! 💘",
      "Marie, you are my Valentine!"
    ]);

    zone.style.display = "none";
    hint.style.display = "none";
    result.style.display = "block";
    party();
  });
</script>
</body>
</html>
