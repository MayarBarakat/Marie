<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marie will you be my Valentine?</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:radial-gradient(circle at top,#ffeef6,#ffd6e7);
      font-family:system-ui,sans-serif;
      overflow:hidden;
    }

    canvas{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:10;
    }

    .card{
      width:min(700px,92vw);
      padding:28px;
      background:#ffffffcc;
      backdrop-filter:blur(10px);
      border-radius:22px;
      text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,.15);
      transition:transform .4s ease;
    }

    h1{
      font-size:clamp(26px,4vw,44px);
      min-height:3em;
    }

    .cursor::after{
      content:"|";
      animation:blink 1s infinite;
    }
    @keyframes blink{50%{opacity:0}}

    .love{color:#ff1f68}

    .zone{
      position:relative;
      width:min(520px,90%);
      height:150px;
      margin:auto;
    }

    button{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      padding:16px 28px;
      font-size:18px;
      font-weight:800;
      border-radius:999px;
      border:none;
      cursor:pointer;
      box-shadow:0 10px 24px rgba(0,0,0,.14);
      transition:
        left .25s ease,
        top .25s ease,
        transform .3s ease,
        background .15s ease;
    }

    #yes{
      left:18%;
      background:#ff3b7a;
      color:white;
    }
    #yes:hover{background:#ff1f68}

    #no{
      left:62%;
      background:#e5e7eb;
    }

    .hint{
      font-size:13px;
      opacity:.7;
      margin-top:10px;
    }

    .result{
      display:none;
      margin-top:18px;
    }

    .result img{
      width:min(380px,90vw);
      display:block;
      margin:14px auto;
    }

    .heart{
      position:fixed;
      bottom:-20px;
      font-size:22px;
      animation:float 3.5s linear forwards;
    }
    @keyframes float{
      to{transform:translateY(-120vh);opacity:0}
    }
  </style>
</head>

<body>
<canvas id="confetti"></canvas>

<div class="card">
  <h1 id="title">Marie will you be my Valentine?</h1>

  <div class="zone" id="zone">
    <button id="yes">Yes</button>
    <button id="no">No</button>
  </div>

  <div class="hint">“No” seems a bit shy 😈</div>

  <div class="result" id="result">
    <h2>💖💖💖</h2>
    <img src="https://media.giphy.com/media/26ufdipQqU2lhNA4g/giphy.gif">
  </div>
</div>

<script>
  const title = document.getElementById("title");
  const yes = document.getElementById("yes");
  const no = document.getElementById("no");
  const zone = document.getElementById("zone");
  const result = document.getElementById("result");

  // Confetti
  const canvas = document.getElementById("confetti");
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  const fx = confetti.create(canvas,{resize:true});

  function party(){
    fx({particleCount:300,spread:160,startVelocity:50});
  }

  // Hearts
  function hearts(){
    for(let i=0;i<12;i++){
      const h=document.createElement("div");
      h.className="heart";
      h.textContent="❤️";
      h.style.left=Math.random()*100+"vw";
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),3500);
    }
  }

  // Typewriter
  function typeLines(lines){
    title.textContent="";
    title.classList.add("cursor");
    let l=0,i=0;

    function step(){
      if(l>=lines.length){
        title.classList.remove("cursor");
        title.classList.add("love");
        return;
      }
      if(i<lines[l].length){
        title.innerHTML+=lines[l][i++];
      }else{
        title.innerHTML+="<br>";
        l++; i=0;
      }
      setTimeout(step,55);
    }
    step();
  }

  // Yes grows / No moves (FASTER)
  let scale=1;
  function growYes(){
    scale=Math.min(2.1,scale+0.06);
    yes.style.transform=`translateY(-50%) scale(${scale})`;
  }

  zone.addEventListener("pointermove",e=>{
    const b=no.getBoundingClientRect();
    const d=Math.hypot(
      (b.left+b.width/2)-e.clientX,
      (b.top+b.height/2)-e.clientY
    );
    if(d<140){
      no.style.left=Math.random()*65+"%";
      no.style.top=Math.random()*65+"%";
      growYes();
    }
  });

  // Yes click
  yes.onclick=()=>{
    document.body.style.background =
      "radial-gradient(circle,#ffe0ec,#ffb3d9)";
    zone.style.display="none";
    document.querySelector(".hint").style.display="none";
    result.style.display="block";

    typeLines([
      "YAAAY 💘",
      "Marie is my Valentine ❤️"
    ]);

    party();
    hearts();
  };
</script>
</body>
</html>
